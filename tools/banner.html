<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #14161a;
        --panel: #1d2026;
        --text: #d8dbe2;
        --dim: #8a8f9c;
        --accent: #5fd8e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(160deg, var(--panel), var(--bg) 68%);
        color: var(--text);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      /* Faint grid, fading out from the centre, so the crop each platform takes still lands on it. */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(0deg, #5fd8e8 0 1px, transparent 1px 7vh),
          repeating-linear-gradient(90deg, #5fd8e8 0 1px, transparent 1px 7vh);
        opacity: 0.06;
        mask-image: radial-gradient(120% 150% at 50% 50%, #000 20%, transparent 78%);
      }

      .lockup {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 6vw;
      }

      .top {
        display: flex;
        align-items: center;
        gap: min(3.4vh, 1.8vw);
      }

      .mark {
        width: min(13vh, 6.2vw);
        height: min(13vh, 6.2vw);
        flex: none;
      }

      h1 {
        margin: 0;
        font-size: min(11vh, 5.2vw);
        line-height: 1;
        letter-spacing: 0.14em;
        font-weight: 700;
        text-indent: 0.14em;
      }

      h1 span {
        color: var(--accent);
      }

      p {
        margin: min(3.4vh, 1.9vw) 0 0;
        color: var(--dim);
        font-size: min(3.6vh, 1.85vw);
        line-height: 1.4;
      }

      .foot {
        display: flex;
        align-items: center;
        gap: min(2vh, 1.1vw);
        margin-top: min(3vh, 1.7vw);
      }

      .foot i {
        width: min(9vh, 4.4vw);
        height: 2px;
        background: var(--accent);
      }

      .foot span {
        font-size: min(2.6vh, 1.35vw);
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <div class="top">
        <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#5fd8e8" stroke-width="2.2">
            <rect x="6.5" y="6.5" width="8.5" height="8.5" />
            <rect x="17" y="17" width="8.5" height="8.5" />
          </g>
          <rect x="17" y="6.5" width="8.5" height="8.5" fill="#5fd8e8" />
          <rect x="6.5" y="17" width="8.5" height="8.5" fill="#5fd8e8" opacity="0.32" />
        </svg>
        <h1>RETRO<span>ATLAS</span></h1>
      </div>
      <p>Mapped from the source.</p>
      <div class="foot"><i></i><span>retroatlas.org</span></div>
    </div>
  </body>
</html>
