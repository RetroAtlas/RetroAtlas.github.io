<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #14161a;
        --panel: #1d2026;
        --text: #d8dbe2;
        --dim: #8a8f9c;
        --line: #32363f;
        --accent: #5fd8e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, var(--panel), var(--bg) 62%);
        color: var(--text);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .mark {
        width: 78px;
        height: 78px;
        margin-bottom: 40px;
      }

      h1 {
        margin: 0;
        font-size: 100px;
        line-height: 1;
        letter-spacing: 0.14em;
        font-weight: 700;
      }

      h1 span {
        color: var(--accent);
      }

      p {
        max-width: 800px;
        margin: 30px 0 0;
        color: var(--dim);
        font-size: 30px;
        line-height: 1.45;
      }

      .foot {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 46px;
      }

      .foot i {
        width: 92px;
        height: 2px;
        background: var(--accent);
      }

      .foot span {
        color: var(--text);
        font-size: 27px;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#5fd8e8" stroke-width="2.2">
        <rect x="6.5" y="6.5" width="8.5" height="8.5" />
        <rect x="17" y="17" width="8.5" height="8.5" />
      </g>
      <rect x="17" y="6.5" width="8.5" height="8.5" fill="#5fd8e8" />
      <rect x="6.5" y="17" width="8.5" height="8.5" fill="#5fd8e8" opacity="0.32" />
    </svg>

    <h1>RETRO<span>ATLAS</span></h1>
    <p>Interactive maps of retro games, extracted straight from the original discs — not redrawn, not screenshotted.</p>
    <div class="foot"><i></i><span>retroatlas.org</span></div>
  </body>
</html>
